name: Contract Drift Check

on:
  pull_request:
    paths:
      - 'lib/contracts/**'
      - 'contracts/**'
      - 'tools/emit-contract.js'
      - 'package.json'
  push:
    branches:
      - master
      - main
    paths:
      - 'lib/contracts/**'
      - 'contracts/**'
      - 'tools/emit-contract.js'
      - 'package.json'

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for uncommitted contract schema drift
        run: npm run check:contracts
